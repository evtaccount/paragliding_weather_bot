services:
  pgbot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # site-local timezone so /today and /tomorrow resolve the right date
      - TZ=${TZ:-Asia/Tbilisi}
      # БД в том же именованном томе, что раньше держал sites.json —
      # старые файлы там же, миграция подхватит их на первом старте
      - DB_PATH=/app/data/pgbot.db
    volumes:
      # named volume — owned by uid 10001 (app), so /add and /removesite can write.
      # A single-file bind mount kept host ownership and broke writes for non-root.
      - pgbot-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgbot-data:
