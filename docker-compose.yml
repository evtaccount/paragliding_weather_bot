services:
  pgbot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # site-local timezone so /today and /tomorrow resolve the right date
      - TZ=${TZ:-Asia/Tbilisi}
      # БД в том же именованном томе, что раньше держал sites.json —
      # старые файлы там же, миграция подхватит их на первом старте
      - DB_PATH=/app/data/pgbot.db
      - API_PORT=${API_PORT:-8080}
      # app.py по умолчанию слушает 127.0.0.1 (верно для bare metal). Здесь
      # это ломает Caddy: pgbot и caddy — разные сетевые пространства, и
      # loopback внутри pgbot снаружи контейнера не виден. Безопасно только
      # потому, что ниже стоит expose без ports — порт не публикуется на
      # хост, и границей остаётся сеть compose, а не бинд.
      - API_HOST=0.0.0.0
    volumes:
      # named volume — owned by uid 10001 (app), so /add and /removesite can write.
      # A single-file bind mount kept host ownership and broke writes for non-root.
      - pgbot-data:/app/data
    expose:
      # Только внутрь сети compose: наружу смотрит Caddy, и опубликованный
      # порт отдавал бы API без TLS всем, кто дотянется до сервера.
      - "${API_PORT:-8080}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      # Caddyfile сам подставляет {$API_PORT:-8080}, но подставлять ему
      # неоткуда, если переменная не долетела до процесса caddy: env_file
      # здесь не подключён, а top-level ${API_PORT:-8080} интерполируется
      # compose'ом из .env только в СВОИХ строках, а не в контейнере caddy.
      - API_PORT=${API_PORT:-8080}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Статики здесь нет намеренно: собранное приложение лежит внутри образа
      # pgbot и отдаёт его pgbot. Смонтированный сюда каталог был бы вторым
      # путём к тому же артефакту и расходился бы с образом после пересборки.
      # Сертификата здесь нет намеренно: по умолчанию Caddy выпускает его сам
      # и хранит в caddy-data. Свой сертификат добавляет оверлей
      # docker-compose.own-cert.yml — он же монтирует директиву tls.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      # service_healthy, а не просто "pgbot запущен": без HEALTHCHECK старт
      # каждого запроса гонялся бы с ещё не готовым uvicorn.
      pgbot:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgbot-data:
  caddy-data:
  caddy-config:
