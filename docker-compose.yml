services:
  pgbot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # site-local timezone so /today and /tomorrow resolve the right date
      - TZ=${TZ:-Asia/Tbilisi}
    volumes:
      # writable so /add and /removesite persist to the host file (also editable by hand)
      - ./sites.json:/app/sites.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
